name: Build Retorika APK (Huawei Mate XT)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Sync web app into Android assets
        run: |
          chmod +x scripts/sync-web-to-android.sh
          ./scripts/sync-web-to-android.sh

      - name: Prepare signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
            echo "KEYSTORE_FILE=release-keystore.jks" >> $GITHUB_ENV
            echo "Release will be signed with the repository signing key (update-safe)."
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set - APK will be signed with the debug key. Add repo secrets SIGNING_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD for update-safe releases."
          fi

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk dist-apk/retorika.apk
          ls -lh dist-apk/retorika.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: retorika-apk
          path: dist-apk/retorika.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: Красноречие (retorika) — Huawei Mate XT Ultimate Design
          body: |
            ### Установка на Huawei Mate XT Ultimate Design (HarmonyOS 4.2 / EMUI 14.2)
            1. Скачайте файл `retorika.apk` из раздела **Assets** ниже.
            2. Откройте файл на Huawei Mate XT и разрешите установку.
            3. Приложение работает 100% офлайн (без Google Play Services) и адаптируется под 1 экран (6.4"), 2 экрана (7.9") и 3 экрана (10.2").
          files: dist-apk/retorika.apk
          make_latest: true
